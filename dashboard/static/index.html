<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    .event-feed { max-height: calc(100vh - 220px); overflow-y: auto; }
    .event-feed::-webkit-scrollbar { width: 6px; }
    .event-feed::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .badge { cursor: pointer; transition: opacity 0.2s; }
    .badge.dimmed { opacity: 0.3; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .ticket-card { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .ticket-card:hover { border-color: #60a5fa; background: rgba(51,65,85,0.8); }
    .ticket-card.selected { border-color: #3b82f6; background: rgba(30,58,95,0.6); }
    .chat-user { background: #1e3a5f; border-radius: 12px 12px 12px 2px; }
    .chat-bot { background: #1e293b; border-radius: 12px 12px 2px 12px; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <h1 class="text-xl font-bold text-white">IT Bot Dashboard</h1>
      <nav class="flex gap-1">
        <a href="/" class="text-sm px-3 py-1.5 rounded-md bg-slate-700 text-white transition-colors">Live</a>
        <a href="/reporting" class="text-sm px-3 py-1.5 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 transition-colors">Reporting</a>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <div id="conn-status" class="flex items-center gap-2 text-sm">
        <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
        <span id="conn-text" class="text-slate-400">Disconnected</span>
      </div>
      <button
        onclick="fetch('/auth/logout',{method:'POST'}).then(()=>location.href='/login')"
        class="text-sm px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 transition-colors"
      >Logout</button>
    </div>
  </header>

  <!-- Main layout -->
  <div class="flex flex-1 h-[calc(100vh-108px)]">
    <!-- Left sidebar: Active Tickets -->
    <aside class="w-72 border-r border-slate-700 p-4 overflow-y-auto bg-slate-800/50">
      <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Active Tickets</h2>
      <div id="tickets-panel" class="space-y-2">
        <p class="text-slate-500 text-sm italic">No active tickets</p>
      </div>
    </aside>

    <!-- Center: Event Feed + Ticket Detail -->
    <main class="flex-1 flex flex-col p-4 overflow-hidden">
      <!-- Filter bar -->
      <div id="filter-bar" class="flex flex-wrap gap-1.5 mb-3"></div>
      <!-- Event feed -->
      <div id="event-feed" class="event-feed flex-1 space-y-1"></div>
      <!-- Ticket detail panel (hidden by default) -->
      <div id="ticket-detail" class="hidden flex-1 overflow-y-auto"></div>
    </main>

    <!-- Right sidebar: Recent Tool Calls -->
    <aside class="w-80 border-l border-slate-700 p-4 overflow-y-auto bg-slate-800/50">
      <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Recent Tool Calls</h2>
      <div id="tools-panel" class="space-y-2">
        <p class="text-slate-500 text-sm italic">No tool calls yet</p>
      </div>
    </aside>
  </div>

  <!-- Stats bar -->
  <footer class="bg-slate-800 border-t border-slate-700 px-6 py-2 flex items-center gap-8 text-sm text-slate-400">
    <span>Messages/hr: <strong id="stat-msg-hr" class="text-white">0</strong></span>
    <span>Open tickets: <strong id="stat-open" class="text-white">0</strong></span>
    <span>Resolved today: <strong id="stat-resolved" class="text-white">0</strong></span>
    <span>Total events: <strong id="stat-total" class="text-white">0</strong></span>
  </footer>

<script>
(function() {
  // --- State ---
  const state = {
    events: [],
    tickets: {},          // ticket_id -> {title, priority, status, channel_id}
    toolCalls: [],        // last 10
    messageTimestamps: [], // for msgs/hr calc
    resolvedToday: 0,
    totalEvents: 0,
    activeFilters: new Set(), // event types to HIDE
  };

  // --- Event type config ---
  const EVENT_COLORS = {
    bot_startup:      { bg: 'bg-purple-900/50', border: 'border-purple-500', text: 'text-purple-300', badge: 'bg-purple-600' },
    message_received: { bg: 'bg-blue-900/50',   border: 'border-blue-500',   text: 'text-blue-300',   badge: 'bg-blue-600' },
    agent_start:      { bg: 'bg-cyan-900/50',   border: 'border-cyan-500',   text: 'text-cyan-300',   badge: 'bg-cyan-600' },
    tool_call:        { bg: 'bg-indigo-900/50', border: 'border-indigo-500', text: 'text-indigo-300', badge: 'bg-indigo-600' },
    tool_result:      { bg: 'bg-indigo-900/50', border: 'border-indigo-500', text: 'text-indigo-300', badge: 'bg-indigo-600' },
    agent_response:   { bg: 'bg-teal-900/50',   border: 'border-teal-500',   text: 'text-teal-300',   badge: 'bg-teal-600' },
    ticket_created:   { bg: 'bg-green-900/50',  border: 'border-green-500',  text: 'text-green-300',  badge: 'bg-green-600' },
    ticket_resolved:  { bg: 'bg-green-900/50',  border: 'border-green-500',  text: 'text-green-300',  badge: 'bg-green-600' },
    ticket_assigned:  { bg: 'bg-yellow-900/50', border: 'border-yellow-500', text: 'text-yellow-300', badge: 'bg-yellow-600' },
    ticket_auto_closed:{ bg: 'bg-orange-900/50',border: 'border-orange-500', text: 'text-orange-300', badge: 'bg-orange-600' },
    channel_created:  { bg: 'bg-green-900/50',  border: 'border-green-500',  text: 'text-green-300',  badge: 'bg-green-600' },
    channel_archived: { bg: 'bg-orange-900/50', border: 'border-orange-500', text: 'text-orange-300', badge: 'bg-orange-600' },
    kb_search:        { bg: 'bg-sky-900/50',    border: 'border-sky-500',    text: 'text-sky-300',    badge: 'bg-sky-600' },
    thread_forwarded: { bg: 'bg-slate-700/50',  border: 'border-slate-500',  text: 'text-slate-300',  badge: 'bg-slate-600' },
    summary_updated:  { bg: 'bg-slate-700/50',  border: 'border-slate-500',  text: 'text-slate-300',  badge: 'bg-slate-600' },
    error:            { bg: 'bg-red-900/50',    border: 'border-red-500',    text: 'text-red-300',    badge: 'bg-red-600' },
  };
  const DEFAULT_COLOR = { bg: 'bg-slate-800/50', border: 'border-slate-600', text: 'text-slate-300', badge: 'bg-slate-600' };

  function getColor(type) { return EVENT_COLORS[type] || DEFAULT_COLOR; }

  // --- DOM refs ---
  const feedEl = document.getElementById('event-feed');
  const ticketsEl = document.getElementById('tickets-panel');
  const toolsEl = document.getElementById('tools-panel');
  const filterBar = document.getElementById('filter-bar');
  const connDot = document.getElementById('conn-dot');
  const connText = document.getElementById('conn-text');

  // --- Filter bar ---
  const allTypes = Object.keys(EVENT_COLORS);
  allTypes.forEach(type => {
    const c = getColor(type);
    const btn = document.createElement('button');
    btn.className = `badge text-xs px-2 py-0.5 rounded-full text-white ${c.badge}`;
    btn.textContent = type;
    btn.dataset.type = type;
    btn.addEventListener('click', () => {
      if (state.activeFilters.has(type)) {
        state.activeFilters.delete(type);
        btn.classList.remove('dimmed');
      } else {
        state.activeFilters.add(type);
        btn.classList.add('dimmed');
      }
      rerenderFeed();
    });
    filterBar.appendChild(btn);
  });

  // --- Format helpers ---
  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('en-US', { hour12: false });
  }

  function truncate(s, n) {
    if (!s) return '';
    return s.length > n ? s.substring(0, n) + '...' : s;
  }

  function summarizeData(data) {
    if (!data || Object.keys(data).length === 0) return '';
    const parts = [];
    for (const [k, v] of Object.entries(data)) {
      const val = typeof v === 'string' ? truncate(v, 60) : JSON.stringify(v);
      parts.push(`${k}=${val}`);
    }
    return parts.join(' | ');
  }

  // --- Render event row ---
  function renderEvent(evt) {
    const c = getColor(evt.type);
    const div = document.createElement('div');
    div.className = `fade-in flex items-start gap-3 px-3 py-2 rounded border-l-2 ${c.bg} ${c.border}`;
    if (state.activeFilters.has(evt.type)) div.style.display = 'none';

    const time = document.createElement('span');
    time.className = 'text-xs text-slate-500 font-mono whitespace-nowrap pt-0.5';
    time.textContent = fmtTime(evt.timestamp);

    const badge = document.createElement('span');
    badge.className = `text-xs px-2 py-0.5 rounded-full text-white whitespace-nowrap ${c.badge}`;
    badge.textContent = evt.type;

    const detail = document.createElement('span');
    detail.className = `text-sm ${c.text} break-all`;
    detail.textContent = summarizeData(evt.data);

    div.appendChild(time);
    div.appendChild(badge);
    div.appendChild(detail);
    return div;
  }

  function rerenderFeed() {
    feedEl.innerHTML = '';
    state.events.forEach(evt => feedEl.appendChild(renderEvent(evt)));
    feedEl.scrollTop = feedEl.scrollHeight;
  }

  // --- Ticket detail state ---
  const detailEl = document.getElementById('ticket-detail');
  let selectedTicketKey = null;

  // --- Render ticket card ---
  function renderTickets() {
    const entries = Object.entries(state.tickets);
    if (entries.length === 0) {
      ticketsEl.innerHTML = '<p class="text-slate-500 text-sm italic">No active tickets</p>';
      return;
    }
    ticketsEl.innerHTML = '';
    entries.forEach(([tid, t]) => {
      const card = document.createElement('div');
      const statusColor = t.status === 'resolved' ? 'bg-green-600' : t.status === 'closed' ? 'bg-slate-600' : 'bg-yellow-600';
      card.className = `ticket-card bg-slate-700/60 rounded-lg p-3 border border-slate-600${selectedTicketKey === tid ? ' selected' : ''}`;
      card.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-mono text-blue-400">${esc(tid)}</span>
          <span class="text-xs px-1.5 py-0.5 rounded ${statusColor} text-white">${t.status || 'open'}</span>
        </div>
        <p class="text-sm text-slate-200 leading-snug">${truncate(t.title, 80) || 'Untitled'}</p>
        ${t.priority ? `<span class="text-xs text-slate-400">Priority: ${t.priority}</span>` : ''}
      `;
      card.addEventListener('click', () => openTicketDetail(tid, t));
      ticketsEl.appendChild(card);
    });
  }

  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  // --- Ticket detail ---
  async function openTicketDetail(tid, ticket) {
    // Toggle off if clicking the same ticket
    if (selectedTicketKey === tid) {
      closeTicketDetail();
      return;
    }

    selectedTicketKey = tid;
    renderTickets(); // re-render to show selected state

    // Show detail panel, hide feed
    feedEl.classList.add('hidden');
    filterBar.parentElement.querySelector('#filter-bar').classList.add('hidden');
    detailEl.classList.remove('hidden');
    detailEl.innerHTML = '<p class="text-slate-500 text-sm py-8 text-center">Loading interaction...</p>';

    // Determine which endpoint to call
    let url;
    if (ticket.db_id) {
      url = `/api/reporting/interaction/${ticket.db_id}`;
    } else {
      url = `/api/reporting/interaction/by-ticket/${encodeURIComponent(tid)}`;
    }

    try {
      const res = await fetch(url);
      if (!res.ok) {
        detailEl.innerHTML = '<p class="text-red-400 text-sm py-8 text-center">Could not load interaction details.</p>';
        return;
      }
      const data = await res.json();
      renderTicketDetail(tid, ticket, data);
    } catch (e) {
      detailEl.innerHTML = '<p class="text-red-400 text-sm py-8 text-center">Failed to fetch interaction.</p>';
    }
  }

  function closeTicketDetail() {
    selectedTicketKey = null;
    detailEl.classList.add('hidden');
    detailEl.innerHTML = '';
    feedEl.classList.remove('hidden');
    filterBar.parentElement.querySelector('#filter-bar').classList.remove('hidden');
    renderTickets();
  }

  function renderTicketDetail(tid, ticket, data) {
    const ix = data.interaction;
    const statusColors = { open: 'bg-yellow-600', resolved: 'bg-green-600', escalated: 'bg-red-600', closed: 'bg-slate-600' };
    const statusCls = statusColors[ix.status] || 'bg-slate-600';

    let html = `
      <div class="mb-4">
        <button id="btn-back-to-feed" class="text-sm text-blue-400 hover:text-blue-300 mb-3 flex items-center gap-1">
          <span>&larr;</span> Back to feed
        </button>
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-5">
          <div class="flex flex-wrap items-center gap-3 mb-3">
            <h3 class="text-lg font-semibold text-white">${esc(tid)}</h3>
            <span class="text-xs px-2 py-0.5 rounded-full text-white ${statusCls}">${esc(ix.status)}</span>
            ${ix.resolved_by_bot ? '<span class="text-xs text-green-400 font-semibold">Resolved by Bot</span>' : ''}
          </div>
          <div class="flex flex-wrap gap-4 text-sm text-slate-400 mb-1">
            <span>Requester: <strong class="text-white">${esc(ix.requester_name)}</strong></span>
            <span>Source: <strong class="text-white">${esc(ix.source)}</strong></span>
            <span>Category: <strong class="text-white">${esc(ix.category) || '—'}</strong></span>
            <span>Priority: <strong class="text-white">${esc(ix.priority)}</strong></span>
            <span>Messages: <strong class="text-white">${ix.message_count}</strong></span>
            <span>Created: <strong class="text-white">${fmtDateTime(ix.created_at)}</strong></span>
          </div>
        </div>
      </div>
    `;

    // Messages
    if (data.messages && data.messages.length > 0) {
      html += '<div class="bg-slate-800 rounded-xl border border-slate-700 p-5 mb-4">';
      html += '<h4 class="text-sm font-semibold text-slate-400 mb-3">Conversation</h4>';
      html += '<div class="space-y-3 max-h-[50vh] overflow-y-auto pr-2">';
      data.messages.forEach(m => {
        const isUser = m.role === 'user';
        const align = isUser ? 'items-start' : 'items-end';
        const bubble = isUser ? 'chat-user' : 'chat-bot';
        const label = isUser ? 'User' : 'Bot';
        const labelColor = isUser ? 'text-blue-400' : 'text-teal-400';
        html += `
          <div class="flex flex-col ${align}">
            <span class="text-xs ${labelColor} mb-0.5">${label} &mdash; ${fmtDateTime(m.timestamp)}</span>
            <div class="${bubble} px-3 py-2 max-w-2xl text-sm text-slate-200 whitespace-pre-wrap">${esc(m.content)}</div>
          </div>
        `;
      });
      html += '</div></div>';
    }

    // Tool calls
    if (data.tool_calls && data.tool_calls.length > 0) {
      html += '<div class="bg-slate-800 rounded-xl border border-slate-700 p-5 mb-4">';
      html += '<h4 class="text-sm font-semibold text-slate-400 mb-3">Tool Calls</h4>';
      html += '<div class="space-y-2">';
      data.tool_calls.forEach(tc => {
        html += `
          <div class="bg-slate-700/50 rounded px-3 py-2 text-sm">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-indigo-300">${esc(tc.tool_name)}</span>
              <span class="text-xs text-slate-500">${fmtDateTime(tc.timestamp)}</span>
            </div>
            <div class="text-xs text-slate-400 font-mono mt-1">${esc(tc.args)}</div>
            ${tc.result_summary ? `<div class="text-xs text-green-400 mt-0.5">${esc(tc.result_summary)}</div>` : ''}
          </div>
        `;
      });
      html += '</div></div>';
    }

    detailEl.innerHTML = html;

    // Wire up back button
    document.getElementById('btn-back-to-feed').addEventListener('click', closeTicketDetail);
  }

  // --- Render tool calls ---
  function renderTools() {
    if (state.toolCalls.length === 0) {
      toolsEl.innerHTML = '<p class="text-slate-500 text-sm italic">No tool calls yet</p>';
      return;
    }
    toolsEl.innerHTML = '';
    // Show newest first
    [...state.toolCalls].reverse().forEach(tc => {
      const item = document.createElement('div');
      const isResult = tc._isResult;
      const statusDot = isResult
        ? (tc.success ? 'bg-green-400' : 'bg-red-400')
        : 'bg-yellow-400 pulse';
      item.className = 'bg-slate-700/60 rounded-lg p-3 border border-slate-600';
      item.innerHTML = `
        <div class="flex items-center gap-2 mb-1">
          <span class="w-2 h-2 rounded-full ${statusDot}"></span>
          <span class="text-sm font-semibold text-indigo-300">${tc.tool_name}</span>
          <span class="text-xs text-slate-500 ml-auto">${fmtTime(tc.timestamp)}</span>
        </div>
        <p class="text-xs text-slate-400 font-mono break-all">${truncate(tc.detail, 120)}</p>
      `;
      toolsEl.appendChild(item);
    });
  }

  // --- Stats ---
  function updateStats() {
    const now = Date.now() / 1000;
    const oneHourAgo = now - 3600;
    const msgsInHour = state.messageTimestamps.filter(t => t > oneHourAgo).length;
    document.getElementById('stat-msg-hr').textContent = msgsInHour;
    document.getElementById('stat-open').textContent = Object.values(state.tickets).filter(t => t.status !== 'resolved' && t.status !== 'closed').length;
    document.getElementById('stat-resolved').textContent = state.resolvedToday;
    document.getElementById('stat-total').textContent = state.totalEvents;
  }

  // --- Process incoming event ---
  function processEvent(evt) {
    state.events.push(evt);
    state.totalEvents++;
    // Keep last 500 in UI
    if (state.events.length > 500) state.events.shift();

    // Track state by event type
    switch (evt.type) {
      case 'message_received':
        state.messageTimestamps.push(evt.timestamp);
        break;
      case 'ticket_created':
        if (evt.data.ticket_id) {
          state.tickets[evt.data.ticket_id] = {
            title: evt.data.title || '',
            priority: evt.data.priority || '',
            status: 'open',
            channel_id: evt.data.channel_id || '',
          };
        }
        break;
      case 'ticket_resolved':
        if (evt.data.ticket_id && state.tickets[evt.data.ticket_id]) {
          state.tickets[evt.data.ticket_id].status = 'resolved';
        }
        state.resolvedToday++;
        break;
      case 'ticket_assigned':
        if (evt.data.ticket_id && state.tickets[evt.data.ticket_id]) {
          state.tickets[evt.data.ticket_id].assignee = evt.data.assignee_name || '';
        }
        break;
      case 'ticket_auto_closed':
        if (evt.data.ticket_id) {
          if (state.tickets[evt.data.ticket_id]) {
            state.tickets[evt.data.ticket_id].status = 'closed';
          }
        }
        break;
      case 'tool_call':
        state.toolCalls.push({
          tool_name: evt.data.tool_name || 'unknown',
          detail: JSON.stringify(evt.data.args || {}),
          timestamp: evt.timestamp,
          _isResult: false,
          success: null,
        });
        if (state.toolCalls.length > 10) state.toolCalls.shift();
        break;
      case 'tool_result':
        state.toolCalls.push({
          tool_name: evt.data.tool_name || 'unknown',
          detail: evt.data.result_summary || '',
          timestamp: evt.timestamp,
          _isResult: true,
          success: true,
        });
        if (state.toolCalls.length > 10) state.toolCalls.shift();
        break;
      case 'error':
        // Mark latest matching tool call as failed if relevant
        break;
    }

    // Append to feed (avoid full re-render)
    const row = renderEvent(evt);
    feedEl.appendChild(row);
    feedEl.scrollTop = feedEl.scrollHeight;

    renderTickets();
    renderTools();
    updateStats();
  }

  // --- WebSocket connection ---
  let ws = null;
  let reconnectTimer = null;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      connDot.className = 'w-2.5 h-2.5 rounded-full bg-green-500';
      connText.textContent = 'Connected';
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };

    ws.onmessage = (msg) => {
      try {
        const evt = JSON.parse(msg.data);
        processEvent(evt);
      } catch (e) {
        console.error('Failed to parse event:', e);
      }
    };

    ws.onclose = () => {
      connDot.className = 'w-2.5 h-2.5 rounded-full bg-red-500';
      connText.textContent = 'Disconnected';
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  // --- Seed state from DB on page load ---
  async function seedFromDB() {
    try {
      const res = await fetch('/api/live/init');
      if (!res.ok) return;
      const data = await res.json();

      // Populate tickets
      for (const t of data.tickets) {
        const key = t.ticket_id || `interaction-${t.id}`;
        state.tickets[key] = {
          db_id: t.id,
          title: t.first_message || t.category || 'Untitled',
          priority: t.priority || '',
          status: t.status || 'open',
          channel_id: t.channel_id || '',
        };
      }

      // Stats
      state.resolvedToday = data.resolved_today || 0;
      state.totalEvents = data.total_interactions || 0;

      // Seed msgs/hr with a synthetic count so the stat renders correctly
      const now = Date.now() / 1000;
      for (let i = 0; i < (data.msgs_last_hour || 0); i++) {
        state.messageTimestamps.push(now);
      }

      // Recent tool calls
      for (const tc of (data.tool_calls || []).reverse()) {
        state.toolCalls.push({
          tool_name: tc.tool_name,
          detail: tc.result_summary || tc.args || '',
          timestamp: new Date(tc.timestamp).getTime() / 1000,
          _isResult: !!tc.result_summary,
          success: !!tc.result_summary,
        });
      }

      renderTickets();
      renderTools();
      updateStats();
    } catch (e) {
      console.error('Failed to seed from DB:', e);
    }
  }

  seedFromDB();
  connect();
  // Refresh stats every 30s
  setInterval(updateStats, 30000);
})();
</script>
