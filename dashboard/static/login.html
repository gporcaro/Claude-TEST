<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — IT Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm mx-auto">
    <h1 class="text-2xl font-bold text-white text-center mb-8">IT Bot Dashboard</h1>

    <!-- Step 1: Email -->
    <div id="step-email" class="bg-slate-800 rounded-xl border border-slate-700 p-6">
      <h2 class="text-lg font-semibold text-white mb-1">Sign in</h2>
      <p class="text-sm text-slate-400 mb-5">Enter your email to receive a login code.</p>
      <input
        id="email-input"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-600 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 mb-4"
      />
      <button
        id="send-btn"
        class="w-full py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >Send Code</button>
      <p id="email-error" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>

    <!-- Step 2: Code -->
    <div id="step-code" class="bg-slate-800 rounded-xl border border-slate-700 p-6 hidden">
      <h2 class="text-lg font-semibold text-white mb-1">Enter code</h2>
      <p class="text-sm text-slate-400 mb-5">
        A 6-digit code was sent to <span id="masked-email" class="text-blue-400"></span>
      </p>
      <input
        id="code-input"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="000000"
        autocomplete="one-time-code"
        class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-600 text-white text-center text-2xl tracking-[0.5em] font-mono placeholder-slate-500 focus:outline-none focus:border-blue-500 mb-4"
      />
      <button
        id="verify-btn"
        class="w-full py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >Verify</button>
      <p id="code-error" class="text-red-400 text-sm mt-3 hidden"></p>
      <div class="flex items-center justify-between mt-4">
        <button id="resend-btn" class="text-sm text-slate-400 hover:text-blue-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Resend code</button>
        <button id="back-btn" class="text-sm text-slate-400 hover:text-blue-400 transition-colors">Use different email</button>
      </div>
    </div>
  </div>

<script>
(function() {
  const stepEmail = document.getElementById('step-email');
  const stepCode  = document.getElementById('step-code');
  const emailInput = document.getElementById('email-input');
  const codeInput  = document.getElementById('code-input');
  const sendBtn    = document.getElementById('send-btn');
  const verifyBtn  = document.getElementById('verify-btn');
  const resendBtn  = document.getElementById('resend-btn');
  const backBtn    = document.getElementById('back-btn');
  const emailError = document.getElementById('email-error');
  const codeError  = document.getElementById('code-error');
  const maskedEmail = document.getElementById('masked-email');

  let currentEmail = '';

  function maskEmail(email) {
    const [local, domain] = email.split('@');
    if (local.length <= 2) return local[0] + '***@' + domain;
    return local[0] + '***' + local[local.length - 1] + '@' + domain;
  }

  function showError(el, msg) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function hideError(el) {
    el.classList.add('hidden');
  }

  function setLoading(btn, loading) {
    btn.disabled = loading;
    if (loading) {
      btn.dataset.origText = btn.textContent;
      btn.textContent = 'Please wait...';
    } else {
      btn.textContent = btn.dataset.origText || btn.textContent;
    }
  }

  async function requestCode() {
    const email = emailInput.value.trim().toLowerCase();
    if (!email || !email.includes('@')) {
      showError(emailError, 'Please enter a valid email address.');
      return;
    }
    hideError(emailError);
    setLoading(sendBtn, true);

    try {
      const res = await fetch('/auth/request-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (res.status === 429) {
        showError(emailError, data.message || 'Too many requests. Please wait.');
        return;
      }
      // Always move to step 2 (generic response doesn't reveal if email is valid)
      currentEmail = email;
      maskedEmail.textContent = maskEmail(email);
      stepEmail.classList.add('hidden');
      stepCode.classList.remove('hidden');
      codeInput.value = '';
      codeInput.focus();
    } catch {
      showError(emailError, 'Network error. Please try again.');
    } finally {
      setLoading(sendBtn, false);
    }
  }

  async function verifyCode() {
    const code = codeInput.value.trim();
    if (code.length !== 6 || !/^\d{6}$/.test(code)) {
      showError(codeError, 'Please enter a 6-digit code.');
      return;
    }
    hideError(codeError);
    setLoading(verifyBtn, true);

    try {
      const res = await fetch('/auth/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, code }),
      });
      const data = await res.json();
      if (data.ok) {
        location.href = '/';
      } else {
        showError(codeError, data.message || 'Invalid code.');
      }
    } catch {
      showError(codeError, 'Network error. Please try again.');
    } finally {
      setLoading(verifyBtn, false);
    }
  }

  async function resendCode() {
    hideError(codeError);
    setLoading(resendBtn, true);
    try {
      const res = await fetch('/auth/request-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail }),
      });
      const data = await res.json();
      if (res.status === 429) {
        showError(codeError, data.message || 'Too many requests.');
      } else {
        codeInput.value = '';
        codeInput.focus();
      }
    } catch {
      showError(codeError, 'Network error. Please try again.');
    } finally {
      setLoading(resendBtn, false);
    }
  }

  function goBack() {
    hideError(codeError);
    stepCode.classList.add('hidden');
    stepEmail.classList.remove('hidden');
    emailInput.focus();
  }

  sendBtn.addEventListener('click', requestCode);
  verifyBtn.addEventListener('click', verifyCode);
  resendBtn.addEventListener('click', resendCode);
  backBtn.addEventListener('click', goBack);

  emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') requestCode(); });
  codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyCode(); });
})();
</script>
</body>
</html>
